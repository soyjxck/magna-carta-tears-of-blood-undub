[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["lib/experiments", ".tmp"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax)
    "B",   # bugbear (likely bugs / footguns)
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# CLI entry points must extend sys.path before importing repo modules.
"patch.py" = ["E402"]
"lib/ship.py" = ["E402"]
"lib/linear.py" = ["E402"]
"lib/cutscenes.py" = ["E402"]

[tool.mypy]
strict = true
mypy_path = "lib"
files = ["patch.py", "lib"]
exclude = ['^lib/experiments/', '^\.tmp/']

# External package without a py.typed marker.
[[tool.mypy.overrides]]
module = ["sfd_muxer", "sfd_muxer.*"]
ignore_missing_imports = true
